[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "esquare-backend"
version = "2.0.0"
description = "ESQUARE FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.48,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.13,<3",
  "email-validator>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "PyJWT[crypto]>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "bcrypt>=4.2,<6",
  "google-auth>=2.38,<3",
  "alembic>=1.15,<2",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["F"]
